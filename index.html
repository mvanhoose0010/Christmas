<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lot Range Generator</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;
    margin:40px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

h2{
    margin-top:0;
}

textarea{
    width:100%;
    height:250px;
    font-family:Consolas,monospace;
    font-size:15px;
    padding:10px;
    box-sizing:border-box;
    resize:vertical;
}

.buttons{
    margin:15px 0;
}

button{
    padding:10px 18px;
    margin-right:10px;
    cursor:pointer;
    font-size:15px;
}

#output{
    background:#fafafa;
}
</style>

</head>
<body>

<div class="container">

<h2>Lot Range Generator</h2>

<p><b>Paste the final lot numbers from Excel (one per line):</b></p>

<textarea id="input" placeholder="Example:

YA0727264R
ZM08012611X
ZN0401262X"></textarea>

<div class="buttons">
<button onclick="generate()">Generate Output</button>
<button onclick="copyOutput()">Copy Output</button>
<button onclick="clearAll()">Clear</button>
</div>

<h3>Output</h3>

<textarea id="output" readonly></textarea>

</div>

<script>

function generate() {

    const lines = document.getElementById("input")
        .value
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(x => x.length);

    let output = [];

    lines.forEach(lot => {

        if (lot.length < 10) {
            output.push("INVALID: " + lot);
            return;
        }

        const prefix = lot.substring(0, 8);      // YA072726
        const suffix = lot.slice(-1);            // R
        const qty = lot.substring(8, lot.length - 1);

        if (!/^\d+$/.test(qty)) {
            output.push("INVALID: " + lot);
            return;
        }

        output.push(`${prefix}${suffix} 1-${parseInt(qty,10)}`);

    });

    document.getElementById("output").value = output.join("\n");
}

</script>

</body>
</html>
